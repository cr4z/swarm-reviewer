name: "Swarm Reviewer - Aggregate"
description: "Synthesizes every review agent's findings into one UnifiedReport (Principle III, FR-005/FR-006/FR-012)."
inputs:
  config_json:
    description: "The whole validated configuration (used only for diff.maxBytes, to report FR-014 truncation)."
    required: true
  aggregator_json:
    description: "JSON object of the single agent with role \"aggregator\" (from validate-config's output)."
    required: true
  reviewer_agents_json:
    description: "JSON array of the configured reviewer agents — used to compute agentsMissing (FR-006)."
    required: true
  aggregator_api_key:
    description: "Resolved credential for the agent with role \"aggregator\". Omitted when the aggregator uses WIF (\"auth\"), which obtains its own credential at run time instead."
    required: false
  github_token:
    description: "Token used to read PR context."
    required: true
outputs:
  report_produced:
    description: "\"true\" if a UnifiedReport was produced, \"false\" if aggregation failed outright (FR-012)."
runs:
  using: "composite"
  steps:
    - name: Download findings
      uses: actions/download-artifact@v4
      with:
        pattern: finding-*
        path: swarm-reviewer-in/findings
        # merge-multiple is deliberately NOT set: every leg's artifact contains a file at the
        # same relative path (finding.json), so merging would silently overwrite all but one.
        # Each artifact is extracted into its own artifact-name subdirectory instead.

    - name: Download agent results
      uses: actions/download-artifact@v4
      with:
        pattern: agent-result-*
        path: swarm-reviewer-in/agent-results
        # Same reasoning as above — no merge-multiple.

    - name: Aggregate
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        INPUT_CONFIG_JSON: ${{ inputs.config_json }}
        INPUT_AGGREGATOR_JSON: ${{ inputs.aggregator_json }}
        INPUT_REVIEWER_AGENTS_JSON: ${{ inputs.reviewer_agents_json }}
        INPUT_AGGREGATOR_API_KEY: ${{ inputs.aggregator_api_key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Upload unified report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unified-report
        path: swarm-reviewer-out/unified-report.json
        if-no-files-found: ignore
        retention-days: 7
